name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: public-placeholder-key
          VITE_SITE_URL: http://localhost:5173
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=critical

      - name: No legacy builder traces
        run: |
          if grep -rIil --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=docs --exclude-dir=scripts --exclude-dir=legacy --exclude-dir=dist --exclude=ci.yml --exclude=package-lock.json --exclude=PROJECT_INFO.md -e lovable -e gptengineer -e flowmind -e "r2.dev" . ; then
            echo "Legacy builder references found (files listed above)."
            exit 1
          fi

      - name: Gemini key must not be in the build
        run: |
          if grep -rIl "AIza" dist ; then
            echo "Possible API key found in dist."
            exit 1
          fi
